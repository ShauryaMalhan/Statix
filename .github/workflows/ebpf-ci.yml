name: eBPF Verifier CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Default agent ring tier (512 KiB) — compile-time map size in statix-ebpf/build.rs
  STATIX_RING_BUF_BYTES: "524288"

jobs:
  build-and-test-userspace:
    name: Userspace build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-userspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-userspace-

      - name: cargo check --workspace
        run: cargo check --workspace

      - name: cargo test (gateway, agent, wire)
        run: cargo test -p statix-gateway -p statix -p statix-wire

      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: "0.22.2"
        run: |
          if [ "$(cargo audit --version 2>/dev/null | awk '{print $2}')" != "$CARGO_AUDIT_VERSION" ]; then
            cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
          fi
          cargo audit --version
      
      - name: cargo audit
        run: cargo audit

  ebpf-verifier-matrix:
    name: eBPF verifier (kernel ${{ matrix.kernel }})
    needs: build-and-test-userspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kernel: ["5.10", "5.15", "6.1", "6.8"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang llvm libelf-dev zlib1g-dev pkg-config \
            qemu-system-x86 qemu-kvm udev iproute2 busybox-static \
            coreutils python3-pip python3-requests python3-argcomplete \
            libvirt-clients kbd kmod file rsync zstd virtiofsd

      - name: Install virtme-ng
        run: pip install --break-system-packages "virtme-ng==1.41"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Rust stable (verify binary)
        uses: dtolnay/rust-toolchain@stable

      # bpfel-unknown-none is tier-3: no rustup rust-std blob. build-std=core + rust-src only (see statix-ebpf/.cargo/config.toml).
      - name: Install Rust nightly (eBPF build)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
            statix-ebpf/target
          key: ${{ runner.os }}-cargo-ebpf-${{ matrix.kernel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ebpf-${{ matrix.kernel }}-
            ${{ runner.os }}-cargo-ebpf-
            ${{ runner.os }}-cargo-userspace-

      # Pin deliberately. bpf-linker 0.11.0 (2026-08-12) dropped
      # `aya-rustc-llvm-proxy`, so it can no longer build against rustc's bundled
      # LLVM and instead needs a system LLVM 21+ (llvm-sys 211/221/231). The
      # runner image ships LLVM 18, so an unpinned `cargo install` fails.
      # 0.10.4 is the last release that uses rustc's own LLVM.
      # Reinstall whenever the cached binary is not exactly the pinned version —
      # the previous `command -v` guard let a stale cached binary mask the pin,
      # which is why this only surfaced once the CI cache expired.
      - name: Install bpf-linker
        env:
          BPF_LINKER_VERSION: "0.10.4"
        run: |
          if [ "$(bpf-linker --version 2>/dev/null | awk '{print $2}')" != "$BPF_LINKER_VERSION" ]; then
            cargo install bpf-linker --locked --version "$BPF_LINKER_VERSION" --force
          fi
          bpf-linker --version

      - name: Build eBPF ELF
        working-directory: statix-ebpf
        run: |
          cargo +nightly build --release \
            -Z build-std=core \
            --target bpfel-unknown-none

      - name: Build statix-ebpf-verify
        run: cargo build --release -p statix --bin statix-ebpf-verify

      - name: Run kernel verifier (virtme-ng + Aya load)
        run: |
          chmod +x scripts/verify-ebpf-kernel.sh
          scripts/verify-ebpf-kernel.sh \
            "${{ matrix.kernel }}" \
            statix-ebpf/target/bpfel-unknown-none/release/statix-ebpf \
            target/release/statix-ebpf-verify
