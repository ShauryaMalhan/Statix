version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    groups:
      kube:
        patterns:
          - "kube"
          - "kube-*"
          - "k8s-openapi"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  
  - package-ecosystem: "cargo"
    directory: "/statix-ebpf"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"