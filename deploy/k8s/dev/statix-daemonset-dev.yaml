# DEV ONLY — attribution smoke test against local k3s.
#
# The production manifest is ../statix-daemonset.yaml; this is not a substitute.
# Differences, all of them local-only shortcuts:
#   * image statix:dev + imagePullPolicy Never  (imported into containerd by hand)
#   * no STATIX_API_TOKEN                       (the dev gateway has no token set)
#   * hostNetwork so 127.0.0.1:3000 reaches the gateway running on the VM host
---
apiVersion: v1
kind: Namespace
metadata:
  name: statix-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: statix-sa
  namespace: statix-system
---
# The pod watcher needs to list and watch pods cluster-wide; this is the
# permission that makes cgroup -> pod attribution possible at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: statix
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: statix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: statix
subjects:
  - kind: ServiceAccount
    name: statix-sa
    namespace: statix-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: statix
  namespace: statix-system
  labels:
    app: statix
spec:
  selector:
    matchLabels:
      app: statix
  template:
    metadata:
      labels:
        app: statix
    spec:
      terminationGracePeriodSeconds: 30
      hostPID: true
      hostNetwork: true
      serviceAccountName: statix-sa
      tolerations:
        - operator: Exists
      containers:
        - name: statix
          image: statix:dev
          imagePullPolicy: Never
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: STATIX_INGEST_URL
              value: http://127.0.0.1:3000/ingest
            - name: STATIX_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STATIX_BPF_DIR
              value: /app/bpf
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            # Tracepoints are attached via tracefs; without this the BPF program
            # loads and verifies, then fails with "tracefs not found".
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
